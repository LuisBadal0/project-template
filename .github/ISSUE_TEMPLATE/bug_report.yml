name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove passwords, tokens, account details and other personal data from anything you paste or attach.
        For security problems, use **Security → Report a vulnerability** instead of an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.3.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system or browser
      placeholder: e.g. Windows 11 24H2, Firefox 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove personal data first.
