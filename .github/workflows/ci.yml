name: CI

# Every pull request and every push to main checks the version and builds.
# A push to main (a merged pull request) also publishes GitHub release
# v<version> with the files the build puts in dist/, unless that version is
# already released or is 0.0.0. To release, bump every file listed in
# .github/version-files in the pull request.
#
# The "version" and "build" jobs are required checks on main
# (.github/scripts/apply-github-settings.ps1). Keep their names, or update the
# script's -RequiredChecks when you rename or split them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version files agree
        id: read
        run: |
          version=$(bash .github/scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest # TODO: windows-latest for Windows-only projects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # TODO: set up the toolchain (pinned to a SHA) and install from the lockfile, e.g.
      # - uses: actions/setup-node@<sha> # vX
      #   with: { node-version: 22, cache: npm }
      # - run: npm ci

      - name: Test
        run: echo "::warning::No tests yet. Replace this step in .github/workflows/ci.yml."

      - name: Build
        run: |
          mkdir -p dist
          echo "::warning::No build yet. Replace this step; put the files to release in dist/."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: [version, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.version != '0.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      TITLE: ${{ github.event.repository.name }} v${{ needs.version.outputs.version }}
    steps:
      - name: Skip versions that are already released
        id: existing
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released. Bump the version to publish a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.skip == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-files
          path: dist
          merge-multiple: true

      - name: Publish release
        if: steps.existing.outputs.skip == 'false'
        run: |
          # Attach the files themselves, even if the build put them in subfolders.
          mapfile -t files < <(find dist -type f 2>/dev/null | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::The build produced no files in dist/; publishing $TAG without attachments."
          else
            for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum -- "$(basename "$f")"); done > SHA256SUMS.txt
            files+=(SHA256SUMS.txt)
            printf '%s\n' "${files[@]}"
          fi
          gh release create "$TAG" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes
